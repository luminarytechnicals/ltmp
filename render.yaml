services:
  # ── Backend (FastAPI + Telethon) ─────────────────────────────
  - type: web
    name: tgcontrol-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      # Set these in the Render dashboard → Environment after first deploy
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      # Optional — only needed for phone login
      - key: PHONE
        sync: false
      - key: SESSION_NAME
        value: my_account
      - key: LOGIN_METHOD
        value: phone
      - key: STORAGE_DIR
        value: /var/data
    disk:
      name: tgcontrol-sessions
      mountPath: /var/data
      sizeGB: 1

  # ── Frontend (Static Site) ───────────────────────────────────
  - type: web
    name: tgcontrol-frontend
    env: static
    rootDir: frontend
    buildCommand: echo "No build step required"
    publishPath: .
