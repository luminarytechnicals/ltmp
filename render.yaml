services:
  - type: web
    name: ltmp
    env: python
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE
        sync: false
      - key: SESSION_NAME
        value: my_account
      - key: LOGIN_METHOD
        value: phone
      - key: STORAGE_DIR
        value: /var/data
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ACTIONS_PER_MINUTE
        value: "8"
      - key: FLOOD_WAIT_BUFFER
        value: "5"
    disk:
      name: ltmp-sessions
      mountPath: /var/data
      sizeGB: 1
