services:
  - type: web
    name: tgcontrol-backend
    env: python
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE
        sync: false
      - key: SESSION_NAME
        value: my_account
      - key: LOGIN_METHOD
        value: phone
      - key: STORAGE_DIR
        value: /var/data
      - key: FRONTEND_ORIGINS
        sync: false
    disk:
      name: tgcontrol-sessions
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: tgcontrol-frontend
    env: static
    rootDir: frontend
    buildCommand: echo "No build step required"
    staticPublishPath: .
